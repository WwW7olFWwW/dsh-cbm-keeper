name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, chokidar ${{ matrix.chokidar }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        chokidar: [with, without]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # chokidar 是 optionalDependency。兩種情況都要綠：
      # 有它 → 走 chokidar 監看；沒有它 → 退回 node:fs.watch（README 的「已知限制」）。
      - name: Install optional dependency (chokidar)
        if: matrix.chokidar == 'with'
        run: npm install --no-save --no-package-lock chokidar@^4

      # glob 不加引號：Node 20 的 --test 不會自己展開 glob，加引號會被當成字面路徑。
      - name: Unit tests
        run: node --test test/*.test.js

  bench:
    name: dirty-chase regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 零外部相依：真的 CbmKeeper、真的 node:fs.watch、真的計時器，
      # 只有 git 探針／CBM CLI／重建本身是注入替身——所以不需要 CBM，也不需要活著的 GUI。
      # 斷言擋的是 0.3.0 那種行為：編輯期間 10 次重建、10 次全被中止、圖譜一次都沒追上。
      # --assert 失敗時 exit code 是 1，CI 就該紅。
      - name: Dirty-chase regression (settle 90)
        run: node tools/bench-dirty-chase.mjs --assert --settle 90

  syntax:
    name: syntax + manifest check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 直接呼叫 package.json 的 script，不要在這裡再抄一份檔案清單：
      # 兩份清單一定會漂移（實際上已經漂移過一次——加了 docs/assets/*.mjs 卻只改了
      # package.json，於是截圖腳本在 CI 上沒被語法檢查到）。單一來源。
      - name: Parse every module
        run: npm run test:syntax
      - name: package.json is valid and installable as a bundle
        run: |
          node -e "const p=require('./package.json'); if(p.private) throw new Error('package.json 仍是 private'); if(!p.dsh?.bundle?.patch) throw new Error('缺少 dsh.bundle.patch'); if(p.license!=='MIT') throw new Error('授權不是 MIT');"

      # 發佈包會被當成 GitHub Release 的預建資產，市場安裝走的就是它。
      # 2026-10-07 曾經因為 files 收了整個 docs/ 而讓它從 104 kB 漲到 672 kB——
      # 其中 566 kB 是 README 用的截圖與開發腳本，安裝者永遠用不到。
      # 這一條把它擋住，順便確保 README 的圖仍然是「repo 專屬資產」。
      - name: Published tarball stays lean
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const packed = JSON.parse(require('fs').readFileSync('pack.json', 'utf8'))[0];
            const leaked = packed.files.filter((f) => f.path.startsWith('docs/assets/')).map((f) => f.path);
            if (leaked.length > 0) throw new Error('docs/assets 不該進發佈包：' + leaked.join(', '));
            if (packed.size > 200000) throw new Error('發佈包過大：' + packed.size + ' bytes（上限 200000）');
            console.log('發佈包 ' + packed.size + ' bytes / ' + packed.entryCount + ' 檔，未含 docs/assets');
          "
